name: Build release assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: ./scripts/package-runtime.sh --output-dir dist/release
      - name: Rebuild and prove deterministic archive
        run: |
          cp dist/release/*.tar.gz /tmp/first.tar.gz
          ./scripts/package-runtime.sh --output-dir dist/release-second
          cmp /tmp/first.tar.gz dist/release-second/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omapilot-${{ github.sha }}-release-candidate
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
